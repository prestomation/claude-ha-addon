---
name: Claude Code
version: "0.1.0"
slug: claude_code
description: >-
  Run Claude Code inside Home Assistant with a mobile-first chat UI in the
  sidebar. Talk to Claude over the Agent Client Protocol (ACP) to edit your
  configuration, run tasks, and more — no terminal required.
url: https://github.com/prestomation/claude-ha-addon
arch:
  - aarch64
  - amd64
# Use the s6-overlay supervisor that ships in the HA base image to start
# services, so the add-on must NOT run its own init.
init: false
# Serve the UI through Home Assistant ingress (in the sidebar) with no exposed
# ports. ingress_port matches the port the Fastify server binds (8099).
ingress: true
ingress_port: 8099
panel_icon: mdi:robot-happy
panel_title: Claude Code
panel_admin: true
# The add-on does not need to talk to the Supervisor or HA Core APIs.
hassio_api: false
homeassistant_api: false
host_network: false
# AppArmor profile shipped alongside this config (apparmor.txt).
apparmor: true
# Modern list-of-strings map format. Grants the add-on access to the listed
# host folders. The add-on also automatically gets a private /data volume for
# persistent storage (auth credentials, Claude config) — no mapping needed.
map:
  - homeassistant_config:rw
  - share:rw
  - media:rw
  - ssl:ro
  - backup:ro
options:
  log_level: info
  working_directory: /homeassistant
schema:
  log_level: list(debug|info|warning|error)
  working_directory: str
