---
# Map each supported architecture to a Home Assistant Debian base image.
# Debian (glibc) is used instead of Alpine (musl) because Node.js and the
# Claude Code / ACP npm packages are easier to install and run on glibc.
build_from:
  aarch64: ghcr.io/home-assistant/aarch64-base-debian:bookworm
  amd64: ghcr.io/home-assistant/amd64-base-debian:bookworm
labels:
  org.opencontainers.image.title: Claude Code
  org.opencontainers.image.description: >-
    Claude Code for Home Assistant with a mobile-first ACP session UI.
  org.opencontainers.image.source: https://github.com/prestomation/claude-ha-addon
  org.opencontainers.image.licenses: MIT
