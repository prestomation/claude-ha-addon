name: E2E (real Claude Code)

# Optional, secret-gated smoke test against the real ACP adapter. It is
# informational: it is skipped automatically when the CLAUDE_CODE_OAUTH_TOKEN
# secret is not configured (e.g. on forks), so it never blocks PRs.

on:
  workflow_dispatch:
  push:
    branches: [main]

defaults:
  run:
    working-directory: claude_code

jobs:
  real-smoke:
    name: Real ACP smoke test
    runs-on: ubuntu-latest
    env:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
    steps:
      - name: Check for token
        id: gate
        run: |
          if [ -z "${CLAUDE_CODE_OAUTH_TOKEN}" ]; then
            echo "No CLAUDE_CODE_OAUTH_TOKEN secret set; skipping real smoke test."
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.gate.outputs.run == 'true'
      - uses: actions/setup-node@v4
        if: steps.gate.outputs.run == 'true'
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: claude_code/package-lock.json
      - name: Install Claude Code + ACP adapter
        if: steps.gate.outputs.run == 'true'
        run: npm install -g @anthropic-ai/claude-code@latest @zed-industries/claude-code-acp@latest
      - name: Build
        if: steps.gate.outputs.run == 'true'
        run: |
          npm ci
          npm run build
      - name: Run real smoke test
        if: steps.gate.outputs.run == 'true'
        run: node scripts/real-smoke.mjs
