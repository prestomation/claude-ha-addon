name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  unit:
    name: Lint, typecheck & unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run build -w mock-acp
      - run: npm run typecheck
      - run: npm run test

  e2e:
    name: End-to-end (mock ACP) + screenshots
    runs-on: ubuntu-latest
    # Run inside the pinned Playwright image so rendered screenshots match the
    # committed baselines deterministically (same OS, fonts and browser build).
    container:
      image: mcr.microsoft.com/playwright:v1.60.0-jammy
    steps:
      - uses: actions/checkout@v4
      - run: npm ci
      - name: Build app
        run: |
          npm run build
          npm run build -w mock-acp
      - name: Run Playwright E2E (compares checked-in screenshots)
        working-directory: e2e
        run: npx playwright test
      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 14
