name: Build add-on image

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build-amd64:
    name: Build image (amd64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build amd64 image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: claude_code/Dockerfile
          platforms: linux/amd64
          push: false
          load: true
          build-args: |
            BUILD_FROM=ghcr.io/home-assistant/amd64-base-debian:bookworm
            BUILD_ARCH=amd64
          tags: claude_code:amd64

  build-aarch64:
    name: Build image (aarch64)
    # Emulated arm64 builds are slow; only validate on push to main.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Build aarch64 image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: claude_code/Dockerfile
          platforms: linux/arm64
          push: false
          build-args: |
            BUILD_FROM=ghcr.io/home-assistant/aarch64-base-debian:bookworm
            BUILD_ARCH=aarch64
          tags: claude_code:aarch64
