name: PR screenshots

# Posts/updates a sticky comment on each PR with the committed UI screenshots
# rendered inline, so reviewers see them in context. The images are referenced
# at the PR head commit so the gallery always reflects the latest push.

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  gallery:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- pr-screenshots -->';
            const sha = context.payload.pull_request.head.sha;
            const repo = `${context.repo.owner}/${context.repo.repo}`;
            const base = `https://raw.githubusercontent.com/${repo}/${sha}/claude_code/e2e/screenshots`;
            const dir = 'claude_code/e2e/screenshots';
            if (!fs.existsSync(`${dir}/mobile`)) {
              core.info('No screenshots directory; skipping.');
              return;
            }
            const names = fs.readdirSync(`${dir}/mobile`).filter(f => f.endsWith('.png')).sort();
            let body = `${marker}\n## 📸 UI screenshots\n\n`;
            body += `Rendered from the committed E2E baselines at \`${sha.slice(0,7)}\`.\n\n`;
            body += `| View | Mobile | Desktop |\n|---|---|---|\n`;
            for (const n of names) {
              const title = n.replace('.png','').replace(/-/g,' ');
              const desktop = fs.existsSync(`${dir}/desktop/${n}`)
                ? `<img src="${base}/desktop/${n}" width="320">` : '—';
              body += `| **${title}** | <img src="${base}/mobile/${n}" width="240"> | ${desktop} |\n`;
            }
            const { owner, repo: name } = context.repo;
            const issue_number = context.payload.pull_request.number;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo: name, issue_number, per_page: 100,
            });
            const existing = comments.find(c => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo: name, comment_id: existing.id, body });
              core.info('Updated screenshot comment.');
            } else {
              await github.rest.issues.createComment({ owner, repo: name, issue_number, body });
              core.info('Created screenshot comment.');
            }
